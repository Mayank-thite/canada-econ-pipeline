version: 2

sources:
  - name: boc
    description: Bank of Canada Valet API, loaded by ingest/boc.py.
    schema: raw
    config:
      freshness:
        # Business daily data. Weekends and holidays mean a 3 to 4 day gap is normal.
        warn_after: {count: 4, period: day}
        error_after: {count: 7, period: day}
      loaded_at_field: "obs_date::timestamp"
    tables:
      - name: boc_observations
        description: One row per series and date. Long format.
        columns:
          - name: series_id
            data_tests: [not_null]
          - name: obs_date
            data_tests: [not_null]
          - name: value
            data_tests: [not_null]
        data_tests:
          - unique_combination:
              arguments:
                columns: [series_id, obs_date]
      - name: boc_series
        description: Series metadata (label, unit) from the Valet seriesDetail block.
        config:
          freshness: null
        columns:
          - name: series_id
            data_tests: [unique, not_null]

  - name: statcan
    description: Statistics Canada Web Data Service, loaded by ingest/statcan.py.
    schema: raw
    tables:
      - name: statcan_observations
        description: One row per vector and reference month.
        columns:
          - name: vector_id
            data_tests: [not_null]
          - name: ref_period
            data_tests: [not_null]
        data_tests:
          - unique_combination:
              arguments:
                columns: [vector_id, ref_period]
      # Freshness is checked per vector. On the whole table, the LFS (out about 5 weeks after the
      # month) would hide a CPI series that had stopped loading. ref_period is the first of the month.
      - name: cpi_observations
        identifier: statcan_observations
        description: CPI rows only, so CPI gets its own freshness check.
        config:
          loaded_at_field: "ref_period::timestamp"
          freshness:
            # CPI for a month comes out in the third week of the next month, so the newest
            # ref_period can be about 82 days old right before a release.
            warn_after: {count: 90, period: day}
            error_after: {count: 120, period: day}
            filter: "vector_id = 41690973"
      - name: unemployment_observations
        identifier: statcan_observations
        description: Unemployment rate rows only, so the LFS gets its own freshness check.
        config:
          loaded_at_field: "ref_period::timestamp"
          freshness:
            # The LFS comes out on the first or second Friday of the next month, so about 70 days at most.
            warn_after: {count: 75, period: day}
            error_after: {count: 105, period: day}
            filter: "vector_id = 2062815"
      - name: statcan_series
        columns:
          - name: vector_id
            data_tests: [unique, not_null]
