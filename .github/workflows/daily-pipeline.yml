name: Daily pipeline

on:
  schedule:
    # 22:30 UTC is 5:30 or 6:30 pm in Toronto, after the Bank of Canada posts the day's FX rates.
    - cron: "30 22 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: daily-pipeline
  cancel-in-progress: false

env:
  PGHOST: localhost
  PGPORT: "5432"
  PGUSER: econ
  PGPASSWORD: econ
  PGDATABASE: econ

jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: econ
          POSTGRES_PASSWORD: econ
          POSTGRES_DB: econ
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U econ -d econ"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install
        run: pip install -r requirements.txt

      - name: Extract and load
        # The service container starts empty each run, so this is a full load (a few seconds).
        run: python -m ingest.main

      - name: Source freshness
        run: dbt source freshness --project-dir transform --profiles-dir transform

      - name: dbt build (models, seeds and tests)
        run: dbt build --project-dir transform --profiles-dir transform

      - name: Export marts
        run: python -m scripts.export_marts

      - name: dbt docs
        run: |
          dbt docs generate --static --project-dir transform --profiles-dir transform
          mkdir -p docs/dbt
          cp transform/target/static_index.html docs/dbt/index.html

      - name: Upload mart files
        uses: actions/upload-artifact@v4
        with:
          name: marts-${{ github.run_id }}
          path: data/marts/
          retention-days: 30

      - name: Upload dbt run results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dbt-results-${{ github.run_id }}
          path: |
            transform/target/run_results.json
            transform/target/sources.json
            transform/logs/dbt.log
          if-no-files-found: ignore
          retention-days: 14

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: run
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
