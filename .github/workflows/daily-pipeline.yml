name: Daily pipeline

on:
  schedule:
    # 22:30 UTC is 5:30 pm EST or 6:30 pm EDT in Toronto. The Bank of Canada posts the day's FX rates
    # around 4:30 pm ET, and Statistics Canada releases at 8:30 am ET, so both are in by then.
    # Weekdays only: neither source publishes on weekends. On a holiday the run just finds no new rows,
    # and the freshness thresholds in _sources.yml allow for long weekends.
    - cron: "30 22 * * 1-5"
  workflow_dispatch:

# Nothing by default. Each job asks for only what it needs, and only the deploy job can write to Pages.
permissions: {}

concurrency:
  group: daily-pipeline
  cancel-in-progress: false

env:
  PGHOST: localhost
  PGPORT: "5432"
  PGUSER: econ
  PGPASSWORD: econ
  PGDATABASE: econ

jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      pages: read
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: econ
          POSTGRES_PASSWORD: econ
          POSTGRES_DB: econ
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U econ -d econ"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install
        run: pip install -r requirements.txt

      - name: Extract and load
        # The service container starts empty each run, so this is a full load (a few seconds).
        run: python -m ingest.main

      - name: Source freshness
        run: dbt source freshness --project-dir transform --profiles-dir transform

      - name: dbt build (models, seeds and tests)
        run: dbt build --project-dir transform --profiles-dir transform

      - name: Export marts
        run: python -m scripts.export_marts

      - name: dbt docs
        run: |
          dbt docs generate --static --project-dir transform --profiles-dir transform
          mkdir -p docs/dbt
          cp transform/target/static_index.html docs/dbt/index.html

      - name: Upload mart files
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: marts-${{ github.run_id }}
          path: data/marts/
          retention-days: 30

      - name: Upload dbt run results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dbt-results-${{ github.run_id }}
          path: |
            transform/target/run_results.json
            transform/target/sources.json
            transform/logs/dbt.log
          if-no-files-found: ignore
          retention-days: 14

      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: docs

  deploy:
    needs: run
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
