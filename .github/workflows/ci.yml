name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PGHOST: localhost
  PGPORT: "5432"
  PGUSER: econ
  PGPASSWORD: econ
  PGDATABASE: econ

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: ruff
        run: |
          ruff check .
          ruff format --check .
      - name: sqlfluff
        run: sqlfluff lint transform

  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: econ
          POSTGRES_PASSWORD: econ
          POSTGRES_DB: econ
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U econ -d econ"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: pytest (offline fixtures, plus upsert tests against the service container)
        run: pytest -v
      - name: dbt parse and compile
        run: |
          python -c "from ingest import db; from ingest.config import database_url; db.ensure_schema(db.connect(database_url()))"
          dbt parse --project-dir transform --profiles-dir transform
          dbt compile --project-dir transform --profiles-dir transform
